aid: metrobloks
name: Metrobloks
description: >-
  Metrobloks, LLC develops and operates multi-tenant colocation data centers in underserved
  metropolitan markets, positioning capacity at the metro edge so that AI inference, IoT, gaming,
  streaming, telecom and financial workloads run closer to the users and devices that generate
  them. Founded by Ernest Popescu (CEO), Scott Couzens (COO), Ryan Shea (SVP Real Estate) and
  Alejandro Maldonado (CMO), the company came out of stealth in June 2024 with an oversubscribed
  $5.2M seed round led by Current Equity Partners with participation from Serena Capital, and has
  since announced a Eurazeo commitment of up to EUR 100 million for European expansion, a financing
  round led by the Canopy Generations Fund, a Kansas City joint venture with Lincoln Property
  Company, and a partnership with Soluna. Sites are announced or under development in Miami FL,
  Phoenix AZ, Detroit MI, Kansas City MO, Indianapolis IN and McAllen TX in North America, plus
  Paris in Europe. The product is physical: modular standardized halls, scalable power, air and
  hybrid liquid cooling with near-zero water consumption, and carrier-neutral interconnection
  including a self-perform cross-connect option. Metrobloks sells infrastructure, not software.
  It publishes no API, no developer portal, no customer self-service platform and no
  machine-readable specification of any kind; its only published compliance claim is a SOC 2 and
  SOC 3 assertion on its ESG page.
